<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Mobile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .section {
      width: 100%;
      max-width: 628px;
      position: relative; /* permite posicionar CTAs sobre a imagem */
      margin-bottom: 30px;
    }

    img, .gif {
      width: 100%;
      height: auto;
      display: block;
    }

    /* CTAs sobre a imagem */
    .cta {
      position: absolute;
      bottom: 20px; /* ajuste vertical */
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .cta a {
      display: inline-block;
      padding: 10px 20px;
      background-color: rgba(0,0,0,0.8);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin: 5px;
    }

    @media (min-width: 769px) {
      /* Futuro desktop */
      .section {
        max-width: 1200px;
      }
    }
  </style>
</head>
<body>

  <!-- Seção 1 -->
  <div class="section">
    <img src="versao_mobile_01.jpg" alt="Versão Mobile 01">
    <div class="cta">
      <a href="https://www.behance.net/nanabiart" target="_blank">Ver no Behance</a>
      <a href="mailto:nanabiart@gmail.com">Entre em contato</a>
    </div>
  </div>

  <!-- Seção 2 -->
  <div class="section">
    <img class="gif" src="cartucho_02.gif" alt="Cartucho 02">
    <div class="cta">
      <a href="https://www.behance.net/nanabiart" target="_blank">Ver no Behance</a>
    </div>
  </div>

  <!-- Seção 3 -->
  <div class="section">
    <img src="versao_mobile_03.jpg" alt="Versão Mobile 03">
    <div class="cta">
      <a href="mailto:nanabiart@gmail.com">Entre em contato</a>
    </div>
  </div>

</body>
</html>
