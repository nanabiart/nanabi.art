<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi! Nanabi.art</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .section {
    width: 100%;
    max-width: 628px;
    position: relative;
    margin-bottom: 20px;
  }

  img, .gif {
    width: 100%;
    height: auto;
    display: block;
  }

  /* CTAs invisíveis mas clicáveis */
  .cta {
    position: absolute;
    display: block;
    width: 140px;  /* largura do botão “Meus Projetos” aproximada */
    height: 50px;  /* altura do botão */
    cursor: pointer;
    background: transparent;
    opacity: 0;
    z-index: 10;
  }

  /* Posições iniciais dos CTAs */
  /* Seção 1: CTA Behance sobre "Meus Projetos" */
  .s1_cta1 { bottom: 40px; left: 50%; transform: translateX(-50%); }

  /* Seção 3 */
  .s3_cta1 { top: 50px; left: 20px; }    /* Behance */
  .s3_cta2 { top: 50px; left: 90px; }    /* LinkedIn */
  .s3_cta3 { top: 50px; right: 20px; }   /* Email */

</style>
</head>
<body>

  <!-- Seção 1 -->
  <div class="section">
    <img src="versao_mobile_01_att.jpg" alt="Versão Mobile 01">
    <a href="https://www.behance.net/nanabiart" target="_blank" class="cta s1_cta1"></a>
  </div>

  <!-- Seção 2 -->
  <div class="section">
    <img class="gif" src="cartucho_02.gif" alt="Cartucho 02">
  </div>

  <!-- Seção 3 -->
  <div class="section">
    <img src="versao_mobile_03.jpg" alt="Versão Mobile 03">
    <a href="https://www.behance.net/nanabiart" target="_blank" class="cta s3_cta1"></a>
    <a href="https://www.linkedin.com/in/nanabi/" target="_blank" class="cta s3_cta2"></a>
    <a href="mailto:nanabiart@gmail.com" class="cta s3_cta3"></a>
  </div>

</body>
</html>
