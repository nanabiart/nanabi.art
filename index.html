<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page Mobile</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background-color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .section {
    width: 100%;
    max-width: 628px; /* largura mobile */
    position: relative; /* permite CTAs sobre a imagem */
    margin-bottom: 20px;
  }

  img, .gif {
    width: 100%;
    height: auto;
    display: block;
  }

  /* CTAs invisíveis */
  .cta {
    position: absolute;
    width: 40px;  /* ajustável */
    height: 40px; /* ajustável */
    cursor: pointer;
    background: transparent; /* invisível */
  }

  /* Posições iniciais dos CTAs */
  /* Seção 1 */
  .s1_cta1 { bottom: 20px; left: 50%; transform: translateX(-50%); } /* Behance no final da fatia */

  /* Seção 3 */
  .s3_cta1 { top: 50px; left: 20px; }  /* Behance lado esquerdo */
  .s3_cta2 { top: 50px; left: 80px; }  /* LinkedIn lado esquerdo */
  .s3_cta3 { top: 50px; right: 20px; } /* Email lado direito */

</style>
</head>
<body>

  <!-- Seção 1 -->
  <div class="section">
    <img src="versao_mobile_01.jpg" alt="Versão Mobile 01">
    <a href="https://www.behance.net/nanabiart" target="_blank" class="cta s1_cta1"></a>
  </div>

  <!-- Seção 2 -->
  <div class="section">
    <img class="gif" src="cartucho_02.gif" alt="Cartucho 02">
    <!-- Nenhum CTA nesta seção -->
  </div>

  <!-- Seção 3 -->
  <div class="section">
    <img src="versao_mobile_03.jpg" alt="Versão Mobile 03">
    <a href="https://www.behance.net/nanabiart" target="_blank" class="cta s3_cta1"></a>
    <a href="https://www.linkedin.com/in/nanabi/" target="_blank" class="cta s3_cta2"></a>
    <a href="mailto:nanabiart@gmail.com" class="cta s3_cta3"></a>
  </div>

</body>
</html>
