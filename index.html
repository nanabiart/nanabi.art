<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hi, nanabi.art!</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .section {
    width: 100%;
    max-width: 628px;
    position: relative;
    margin-bottom: 20px;
    border: 1px solid #ccc;
  }

  img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* CTAs com cores para visualização */
  .cta-visual {
    position: absolute;
    border: 2px dashed red;
    background: rgba(255,0,0,0.2);
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    line-height: 1.5;
    z-index: 20;
  }

  /* Posicionamento aproximado dos CTAs na imagem 3 */
  .s3_cta1 { top: 12%; left: 5%; width: 20%; height: 6%; } /* Behance */
  .s3_cta2 { top: 12%; left: 30%; width: 12%; height: 5%; } /* LinkedIn */
  .s3_cta3 { bottom: 5%; right: 5%; width: 25%; height: 6%; } /* Email inferior */
  .s3_cta4 { top: 8%; right: 5%; width: 25%; height: 6%; } /* Email superior */
</style>
</head>
<body>

<div class="section">
  <img src="versao_mobile_03.jpg" alt="Versão Mobile 03">

  <div class="cta-visual s3_cta1">Behance</div>
  <div class="cta-visual s3_cta2">LinkedIn</div>
  <div class="cta-visual s3_cta3">Email Inferior</div>
  <div class="cta-visual s3_cta4">Email Superior</div>
</div>

</body>
</html>
